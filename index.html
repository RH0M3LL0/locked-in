<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e17">
    <meta name="description" content="Cyber-Tech Academic Portal for Computer Science & Robotics Education">
    <title>Nexus CS | Departmental Academic Portal</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0a0e17',
                            card: '#111827',
                            border: '#1f2937',
                            cyan: '#00f3ff',
                            green: '#00ff66',
                            accent: '#7000ff'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0a0e17;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .glow-cyan {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        
        .glow-green {
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        .border-glow {
            border: 1px solid rgba(0, 243, 255, 0.3);
        }
        
        /* Custom scrollbars for cyber look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0e17;
        }
        ::-webkit-scrollbar-thumb {
            background: #00f3ff;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

    <!-- LOW BANDWIDTH ANIMATED LOADING SCREEN -->
    <div id="loading-screen" class="fixed inset-0 bg-[#0a0e17] z-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative w-20 h-20 flex items-center justify-center">
            <div class="absolute inset-0 border-4 border-t-[#00f3ff] border-r-transparent border-b-[#00ff66] border-l-transparent rounded-full animate-spin"></div>
            <span class="text-xs font-mono text-[#00f3ff] tracking-widest animate-pulse">NEXUS</span>
        </div>
        <p class="mt-4 text-xs font-mono text-gray-400 tracking-wider">INITIALIZING CORE SYSTEM...</p>
    </div>

    <!-- SUPABASE CONFIG MODAL / DRAWER -->
    <div id="config-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-40 flex items-center justify-center p-4">
        <div class="bg-[#111827] border border-[#00f3ff]/40 w-full max-w-md p-6 rounded-xl shadow-2xl glow-cyan">
            <h3 class="text-lg font-bold text-[#00f3ff] font-mono mb-2">// SUPABASE DATABASE SETUP</h3>
            <p class="text-xs text-gray-400 mb-4">Enter your Supabase Project credentials below to link the database.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-gray-300 mb-1">PROJECT URL</label>
                    <input type="text" id="cfg-url" placeholder="https://your-project.supabase.co" class="w-full bg-[#0a0e17] border border-gray-700 rounded p-2.5 text-xs text-[#00f3ff] focus:border-[#00f3ff] focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-mono text-gray-300 mb-1">ANON / PUBLIC KEY</label>
                    <input type="password" id="cfg-key" placeholder="eyJhbGciOiJIUzI1NiI..." class="w-full bg-[#0a0e17] border border-gray-700 rounded p-2.5 text-xs text-[#00f3ff] focus:border-[#00f3ff] focus:outline-none">
                </div>
                <button onclick="saveSupabaseConfig()" class="w-full bg-[#00f3ff] text-black font-bold font-mono py-2.5 rounded hover:bg-[#00f3ff]/80 transition">CONNECT SYSTEM</button>
            </div>
        </div>
    </div>

    <!-- TOP HEADER NAVBAR -->
    <header class="bg-[#111827]/90 backdrop-blur-md border-b border-gray-800 sticky top-0 z-30 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-[#00ff66] rounded-full animate-ping"></div>
            <h1 class="text-lg font-black font-mono tracking-wider text-white">NEXUS<span class="text-[#00f3ff]">.CS</span></h1>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="toggleConfigModal()" class="p-2 bg-[#0a0e17] border border-gray-700 rounded text-xs text-gray-300 hover:border-[#00f3ff]">
                ⚙️ DB Config
            </button>
            <div id="user-badge" class="hidden flex items-center gap-2 bg-[#0a0e17] border border-[#00f3ff]/30 px-3 py-1 rounded-full text-xs font-mono text-[#00f3ff]">
                <span id="role-tag">STUDENT</span>
            </div>
        </div>
    </header>

    <!-- MAIN VIEW CONTAINER -->
    <main class="flex-1 p-4 max-w-4xl mx-auto w-full pb-24">
        
        <!-- AUTHENTICATION VIEW -->
        <section id="view-auth" class="space-y-6 max-w-md mx-auto py-8">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-bold font-mono text-white tracking-wide">SYSTEM ACCESS</h2>
                <p class="text-xs text-gray-400">Department of Computer Science & Robotics Education</p>
            </div>

            <!-- Role Selector Tabs -->
            <div class="grid grid-cols-4 gap-1 bg-[#111827] p-1 rounded-lg border border-gray-800 text-xs font-mono">
                <button onclick="selectAuthRole('STUDENT')" id="tab-STUDENT" class="py-2 rounded text-center bg-[#00f3ff] text-black font-bold">STUDENT</button>
                <button onclick="selectAuthRole('COURSE_REP')" id="tab-COURSE_REP" class="py-2 rounded text-center text-gray-400">REP</button>
                <button onclick="selectAuthRole('LECTURER')" id="tab-LECTURER" class="py-2 rounded text-center text-gray-400">LECTURER</button>
                <button onclick="selectAuthRole('ADMIN')" id="tab-ADMIN" class="py-2 rounded text-center text-gray-400">ADMIN</button>
            </div>

            <!-- Auth Form -->
            <form onsubmit="handleAuthSubmit(event)" class="bg-[#111827] p-6 rounded-xl border border-gray-800 space-y-4">
                <div id="field-reg-num">
                    <label class="block text-xs font-mono text-gray-300 mb-1">REGISTRATION NUMBER</label>
                    <input type="text" id="auth-identifier" placeholder="2023/259021" class="w-full bg-[#0a0e17] border border-gray-700 rounded p-2.5 text-xs text-[#00f3ff] focus:border-[#00f3ff] focus:outline-none uppercase">
                </div>

                <div id="field-email" class="hidden">
                    <label class="block text-xs font-mono text-gray-300 mb-1">EMAIL ADDRESS</label>
                    <input type="email" id="auth-email" placeholder="lecturer@portal.edu.ng" class="w-full bg-[#0a0e17] border border-gray-700 rounded p-2.5 text-xs text-[#00f3ff] focus:border-[#00f3ff] focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-mono text-gray-300 mb-1">ACCESS PASSCODE / PASSWORD</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-[#0a0e17] border border-gray-700 rounded p-2.5 text-xs text-[#00f3ff] focus:border-[#00f3ff] focus:outline-none">
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="auth-terms" required class="accent-[#00f3ff]">
                    <label for="auth-terms" class="text-xs text-gray-400">I agree to the <a href="#" class="text-[#00f3ff] underline">Terms & Conditions</a></label>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-[#00f3ff] to-[#00ff66] text-black font-bold font-mono py-3 rounded hover:opacity-90 transition glow-cyan mt-4">AUTHENTICATE</button>
            </form>
        </section>

        <!-- DASHBOARD VIEW -->
        <section id="view-dashboard" class="hidden space-y-6">
            <div class="bg-[#111827] border border-gray-800 p-5 rounded-xl flex items-center justify-between">
                <div>
                    <p class="text-xs font-mono text-gray-400">WELCOME BACK</p>
                    <h2 id="dash-user-name" class="text-lg font-bold text-white font-mono">Student Account</h2>
                    <p id="dash-user-id" class="text-xs text-[#00f3ff] font-mono">2023/259021</p>
                </div>
                <div id="dash-[#00ff66]" class="text-right">
                    <p class="text-xs font-mono text-gray-400">ACADEMIC CGPA</p>
                    <p id="dash-cgpa" class="text-2xl font-black text-[#00ff66] font-mono">4.52</p>
                </div>
            </div>

            <!-- Quick Action Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <button class="bg-[#111827] border border-gray-800 hover:border-[#00f3ff] p-4 rounded-xl text-left space-y-2 group transition">
                    <div class="text-xl">📚</div>
                    <div class="font-mono text-xs text-white group-hover:text-[#00f3ff]">Courses</div>
                </button>
                <button class="bg-[#111827] border border-gray-800 hover:border-[#00f3ff] p-4 rounded-xl text-left space-y-2 group transition">
                    <div class="text-xl">📝</div>
                    <div class="font-mono text-xs text-white group-hover:text-[#00f3ff]">Assessments</div>
                </button>
                <button class="bg-[#111827] border border-gray-800 hover:border-[#00f3ff] p-4 rounded-xl text-left space-y-2 group transition">
                    <div class="text-xl">👨‍🏫</div>
                    <div class="font-mono text-xs text-white group-hover:text-[#00f3ff]">Lecturers</div>
                </button>
                <button class="bg-[#111827] border border-gray-800 hover:border-[#00f3ff] p-4 rounded-xl text-left space-y-2 group transition">
                    <div class="text-xl">🎫</div>
                    <div class="font-mono text-xs text-white group-hover:text-[#00f3ff]">Support</div>
                </button>
            </div>
        </section>

    </main>

    <!-- MOBILE-FIRST BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#111827]/95 backdrop-blur-lg border-t border-gray-800 p-2 flex justify-around items-center z-30">
        <button onclick="switchView('dashboard')" class="flex flex-col items-center gap-1 text-xs text-[#00f3ff] font-mono">
            <span class="text-base">⚡</span>
            <span>Portal</span>
        </button>
        <button onclick="switchView('courses')" class="flex flex-col items-center gap-1 text-xs text-gray-400 font-mono hover:text-white">
            <span class="text-base">📖</span>
            <span>Courses</span>
        </button>
        <button onclick="switchView('calendar')" class="flex flex-col items-center gap-1 text-xs text-gray-400 font-mono hover:text-white">
            <span class="text-base">📅</span>
            <span>Calendar</span>
        </button>
        <button onclick="switchView('profile')" class="flex flex-col items-center gap-1 text-xs text-gray-400 font-mono hover:text-white">
            <span class="text-base">👤</span>
            <span>Profile</span>
        </button>
    </nav>

    <!-- SYSTEM JS CONTROLLER -->
    <script>
        let selectedRole = 'STUDENT';
        let supabaseClient = null;

        // Hide Loading Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('opacity-0');
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                }, 500);
            }, 800);
            
            initSupabaseFromStorage();
        });

        // Supabase Initialization
        function initSupabaseFromStorage() {
            const url = localStorage.getItem('nexus_sb_url');
            const key = localStorage.getItem('nexus_sb_key');
            
            if (url && key && window.supabase) {
                supabaseClient = window.supabase.createClient(url, key);
                console.log('Supabase client initialized successfully.');
            }
        }

        function toggleConfigModal() {
            const modal = document.getElementById('config-modal');
            modal.classList.toggle('hidden');
        }

        function saveSupabaseConfig() {
            const url = document.getElementById('cfg-url').value.trim();
            const key = document.getElementById('cfg-key').value.trim();

            if (!url || !key) {
                alert('Please provide both Project URL and Anon API Key.');
                return;
            }

            localStorage.setItem('nexus_sb_url', url);
            localStorage.setItem('nexus_sb_key', key);
            
            initSupabaseFromStorage();
            toggleConfigModal();
            alert('Supabase credentials saved successfully!');
        }

        // Auth Role Tab Switcher
        function selectAuthRole(role) {
            selectedRole = role;
            ['STUDENT', 'COURSE_REP', 'LECTURER', 'ADMIN'].forEach(r => {
                const btn = document.getElementById(`tab-${r}`);
                if (r === role) {
                    btn.className = "py-2 rounded text-center bg-[#00f3ff] text-black font-bold";
                } else {
                    btn.className = "py-2 rounded text-center text-gray-400 hover:text-white";
                }
            });

            // Adjust form inputs based on role specification
            if (role === 'LECTURER') {
                document.getElementById('field-reg-num').classList.add('hidden');
                document.getElementById('field-email').classList.remove('hidden');
            } else {
                document.getElementById('field-reg-num').classList.remove('hidden');
                document.getElementById('field-email').classList.add('hidden');
            }
        }

        // Handle Auth Submit
        function handleAuthSubmit(e) {
            e.preventDefault();
            
            // Switch to Dashboard View on Demo Login
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            
            const badge = document.getElementById('user-badge');
            badge.classList.remove('hidden');
            document.getElementById('role-tag').innerText = selectedRole;
        }

        function switchView(viewName) {
            if (viewName === 'dashboard') {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('view-dashboard').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
