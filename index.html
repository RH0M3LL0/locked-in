<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0e17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CS Portal"><title>CS &amp; Robotics Portal</title>
<style>
:root{--bg:#0a0e17;--cd:#101828;--tx:#e6f3ff;--mu:#7f93b2;--ac:#00f3ff;--gr:#00ff66;--bd:#1b2a44;--er:#ff4d6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background-image:linear-gradient(rgba(0,243,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,243,255,.05) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
#ld{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}#ld.x{opacity:0;pointer-events:none}
.gear{width:76px;height:76px;color:var(--ac);animation:sp 4s linear infinite;filter:drop-shadow(0 0 10px var(--ac))}@keyframes sp{to{transform:rotate(360deg)}}
.bar{width:180px;height:4px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:40%;background:var(--gr);box-shadow:0 0 8px var(--gr);animation:sl 1.1s infinite}@keyframes sl{from{margin-left:-40%}to{margin-left:100%}}
#app{max-width:980px;margin:0 auto;padding:12px 12px 100px;min-height:80vh}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px}header b{font-size:17px;color:var(--ac)}
.bc{font:12px ui-monospace,Menlo,monospace;color:var(--mu);margin:0 0 10px}.bc b{color:var(--gr)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(16,24,40,.96);border-top:1px solid var(--bd);scrollbar-width:none}
nav button{display:flex;flex-direction:column;align-items:center;flex:1 0 62px;padding:4px 6px;min-height:50px;border:0;background:none;font-size:20px;line-height:1.1}nav small{font-size:10px;color:var(--mu)}nav button.on{background:rgba(0,243,255,.12)}nav button.on small{color:var(--ac)}
button{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer;min-height:44px;touch-action:manipulation}
button.p{background:var(--ac);color:#021015;border-color:var(--ac);font-weight:600;box-shadow:0 0 14px -4px var(--ac)}button.g2{background:var(--gr);color:#021508;border-color:var(--gr)}button.d{color:var(--er)}button.s{padding:5px 10px;min-height:34px;font-size:13px}
.c{background:var(--cd);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:14px;padding:14px;margin-bottom:12px}.c h3{margin:0 0 8px;font-size:16px}
.tile{text-align:center;display:block;width:100%}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}input[type=checkbox]{width:auto;margin:0 8px 0 0}
label{font-size:13px;color:var(--mu)}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;background:rgba(0,243,255,.12);color:var(--ac);border-radius:99px;padding:1px 10px;font-size:12px}.tag.ok{color:var(--gr);background:rgba(0,255,102,.1)}.tag.er{color:var(--er);background:rgba(255,77,109,.1)}
.big{font:700 46px/1.1 ui-monospace,Menlo,monospace;text-align:center;color:var(--gr);text-shadow:0 0 14px rgba(0,255,102,.5);padding:10px 0}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);align-items:center}.row:last-child{border:0}
.lw{max-width:400px;margin:5vh auto 0}.lnk{background:none;border:0;color:var(--ac);padding:6px 0;min-height:0;text-decoration:underline}
#md{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px}#md.on{display:flex}#md .c{max-width:420px;width:100%;max-height:90vh;overflow:auto;margin:0}
</style></head><body>
<div id="ld"><svg class="gear" viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="8" stroke-dasharray="6 5.2"/><circle cx="32" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="32" r="5" fill="currentColor"/></svg><b style="color:var(--ac)">CS &amp; Robotics Portal</b><div class="bar"><i></i></div><span class="mu">Booting portal systems…</span></div>
<div id="app"></div><div id="md"><div class="c" id="mb"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== CONFIG: paste your Supabase project values =====
const CFG={URL:'https://YOUR-PROJECT.supabase.co',KEY:'YOUR-ANON-KEY',
  CODES:{LECTURER:'LECT-2026',COURSE_REP:'REP-2026',ADMIN:'ADMIN-2026'}}; // sign-up codes for non-student roles (change them)
const db=supabase.createClient(CFG.URL,CFG.KEY);
const $=s=>document.querySelector(s),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fd=d=>d?new Date(d).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'';
const TB={STUDENT:'students',COURSE_REP:'course_reps',LECTURER:'lecturers',ADMIN:'admins'},REG=/^\d{4}\/\d{6}$/,RN={STUDENT:'Student',COURSE_REP:'Course Rep',LECTURER:'Lecturer',ADMIN:'Admin'};
const NAV={STUDENT:['home','dir','mat','exam','res','cal','tk','nf'],COURSE_REP:['home','dir','mat','cal','nf'],LECTURER:['home','dir','mat','exam','res','cal','nf'],ADMIN:['home','dir','mat','cal','tk','adm','nf']};
const TI={home:['🏠','Home'],dir:['👥','Lecturers'],mat:['📄','Materials'],exam:['📝','Assess'],res:['🎯','Results'],cal:['📅','Calendar'],tk:['🎫','Tickets'],adm:['🛠','Admin'],nf:['🔔','Alerts']};
let me=JSON.parse(localStorage.getItem('sess')||'null'),tab='home',draft=[],tm,DIR=[],MAT=[];
const ok=r=>{if(r.error)throw new Error(r.error.message);return r.data};
const v=h=>$('#v').innerHTML=h,err=e=>v(`<div class="c" style="border-left-color:var(--er)">${H(e.message)}</div>`),go=t=>{tab=t;R()};
const isSt=()=>me.role=='STUDENT',isLec=()=>me.role=='LECTURER',isAd=()=>me.role=='ADMIN',canUp=()=>me.role!='STUDENT';
const grade=s=>s>=70?['A',5]:s>=60?['B',4]:s>=50?['C',3]:s>=45?['D',2]:s>=40?['E',1]:['F',0];
const notify=(rows)=>db.from('notifications').insert(rows);
function modal(h){$('#mb').innerHTML=h;$('#md').classList.add('on')}function closeM(){$('#md').classList.remove('on')}
// ---------- Auth ----------
function authView(){return`<div class="lw c"><h2 style="margin:0 0 4px;color:var(--ac)">Sign in</h2><p class="mu" style="margin-top:0">Computer Science &amp; Robotics Department</p>${CFG.URL.includes('YOUR-PROJECT')?'<div class="tag er" style="margin-bottom:10px">Set CFG.URL and CFG.KEY at the top of the script.</div>':''}
<label>I am a</label><select id="lr" onchange="lh()">${Object.keys(RN).map(r=>`<option value="${r}">${RN[r]}</option>`)}</select><label id="ll">Registration number (e.g. 2023/259021)</label><input id="li" autocapitalize="none" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="event.key=='Enter'&&login()">
<label style="display:flex;align-items:center;color:var(--tx)"><input type="checkbox" id="lt">I agree to the&nbsp;<button class="lnk" onclick="terms()">Terms &amp; Conditions</button></label><div id="er" class="tag er" style="background:none;padding:0"></div>
<button class="p" style="width:100%;margin-top:8px" onclick="login()">Sign in</button><div class="r" style="justify-content:space-between;margin-top:8px"><button class="lnk" onclick="fp()">Forgot password?</button><button class="lnk" onclick="signup()">Create account</button></div></div>`}
function lh(){$('#ll').textContent=$('#lr').value=='LECTURER'?'Email or phone number':'Registration number (e.g. 2023/259021)'}
const msg=(t,c)=>{const e=$('#er');if(e){e.className='tag '+(c||'er');e.style.background='none';e.textContent=t}};
function terms(){modal(`<h3>Terms &amp; Conditions</h3><p class="mu">By using this portal you agree to: keep your login details private; use materials and assessments only for your coursework; not share assessment passcodes or answers; and accept that activity on the portal may be reviewed by department staff. Misuse can lead to account suspension.</p><button class="p" onclick="closeM()">Close</button>`)}
async function find(role,id){const t=TB[role];if(role=='LECTURER'){if(!/^[\w.@+\- ]+$/.test(id))return null;return ok(await db.from(t).select('*').or(`email.eq.${id},phone_number.eq.${id}`).limit(1))[0]}
if(!REG.test(id))return null;return ok(await db.from(t).select('*').eq('reg_num',id).limit(1))[0]}
async function login(){const role=$('#lr').value,id=$('#li').value.trim();if(!$('#lt').checked)return msg('Please accept the Terms & Conditions.');
try{const u=await find(role,id);if(!u||u.password_hash!==$('#lp').value)return msg('Incorrect details or password.');
me={role,id:u.id,name:u.full_name,email:u.email,phone:u.phone_number,reg:u.reg_num||'',level:u.level||null};localStorage.setItem('sess',JSON.stringify(me));tab='home';await R();if(isSt())remind()}catch(e){msg(e.message)}}
function out(){me=null;localStorage.removeItem('sess');R()}
// Forgot password (development mode: shows the stored plain-text password after identity checks)
function fp(){modal(`<h3>Recover password</h3><label>I am a</label><select id="fr" onchange="$('#fl').textContent=this.value=='LECTURER'?'Email':'Registration number';$('#fc').textContent=this.value=='LECTURER'?'Phone number on file':'Email on file'">${Object.keys(RN).map(r=>`<option value="${r}">${RN[r]}</option>`)}</select><label id="fl">Registration number</label><input id="fi" autocapitalize="none"><label id="fc">Email on file</label><input id="fe" autocapitalize="none"><div id="fm" class="mu"></div><div class="r"><button class="p" onclick="fpGo()">Find my password</button><button onclick="closeM()">Cancel</button></div>`)}
async function fpGo(){const role=$('#fr').value,id=$('#fi').value.trim(),c=$('#fe').value.trim().toLowerCase(),m=$('#fm');
try{let u;if(role=='LECTURER'){if(!/^[\w.@+\-]+$/.test(id))throw 0;u=ok(await db.from('lecturers').select('*').eq('email',id).limit(1))[0];if(u&&String(u.phone_number).replace(/\s/g,'')!==c.replace(/\s/g,''))u=null}
else{if(!REG.test(id))throw 0;u=ok(await db.from(TB[role]).select('*').eq('reg_num',id).limit(1))[0];if(u&&u.email.toLowerCase()!==c)u=null}
m.innerHTML=u?`<div class="tag ok" style="font-size:15px;padding:6px 12px">Your password: <b>${H(u.password_hash)}</b></div>`:'<span style="color:var(--er)">No account matches those details.</span>'}catch(e){m.innerHTML='<span style="color:var(--er)">Check the details and try again.</span>'}}
function signup(){$('#app').innerHTML=`<div class="lw c"><h2 style="margin:0 0 8px;color:var(--ac)">Create account</h2><label>I am a</label><select id="sr" onchange="sf()">${Object.keys(RN).map(r=>`<option value="${r}">${RN[r]}</option>`)}</select><label>Full name</label><input id="sn" autocomplete="name"><label>Email</label><input id="se" type="email" autocapitalize="none"><label>Phone number</label><input id="sh" type="tel"><div id="sx"></div><label>Password</label><input id="sp" type="password" autocomplete="new-password"><label>Confirm password</label><input id="sq" type="password" autocomplete="new-password">
<label style="display:flex;align-items:center;color:var(--tx)"><input type="checkbox" id="lt">I agree to the&nbsp;<button class="lnk" onclick="terms()">Terms &amp; Conditions</button></label><div id="er" class="tag er" style="background:none;padding:0"></div><button class="p" style="width:100%;margin-top:8px" onclick="reg()">Create account</button><button class="lnk" onclick="R()">Back to sign in</button></div>`;sf()}
function sf(){const r=$('#sr').value;$('#sx').innerHTML=(r=='LECTURER'?`<label>Designation</label><input id="sd" placeholder="e.g. Senior Lecturer"><label>Office location</label><input id="so">`:`<label>Registration number (YYYY/XXXXXX)</label><input id="sg" placeholder="2023/259021">`+(r=='ADMIN'?'':`<label>Level</label><select id="sl">${[100,200,300,400,500].map(x=>`<option>${x}</option>`)}</select>`))+(r=='STUDENT'?'':`<label>Sign-up code (from the department)</label><input id="sc" autocapitalize="none">`)}
async function reg(){const g=i=>($('#'+i)?$('#'+i).value:'').trim(),r=g('sr');
if(!$('#lt').checked)return msg('Please accept the Terms & Conditions.');if($('#sp').value.length<6||$('#sp').value!==$('#sq').value)return msg('Passwords must match (6+ characters).');
if(r!='STUDENT'&&g('sc')!==CFG.CODES[r])return msg('Invalid sign-up code.');if(!g('sn')||!g('se')||!g('sh'))return msg('Name, email and phone are required.');
const row={full_name:g('sn'),email:g('se').toLowerCase(),phone_number:g('sh'),password_hash:$('#sp').value};
if(r=='LECTURER'){row.designation=g('sd')||'Lecturer';row.office_location=g('so')||null}else{if(!REG.test(g('sg')))return msg('Registration number must look like 2023/259021.');row.reg_num=g('sg');if(r!='ADMIN')row.level=+g('sl')}
const{error}=await db.from(TB[r]).insert(row);if(error)return msg(error.code=='23505'?'That registration number, email or phone is already registered.':error.message);
await R();msg('Account created. Sign in below.','ok')}
// ---------- Shell ----------
async function R(){clearInterval(tm);const a=$('#app');if(!me){a.innerHTML=authView();return}
const nv=NAV[me.role];if(!nv.includes(tab))tab='home';
a.innerHTML=`<header><div><b>🤖 ${H(me.name)}</b><div class="mu">${RN[me.role]}${me.reg?' · '+H(me.reg):''}</div></div><button class="s" onclick="out()">Sign out</button></header><div class="bc"><b>Portal</b> › ${TI[tab][1]}</div><div id="v"></div><nav>${nv.map(k=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${TI[k][0]}<small>${TI[k][1]}${k=='nf'?' <b id="nfb" style="color:var(--gr)"></b>':''}</small></button>`).join('')}</nav>`;
bell();try{await V[tab]()}catch(e){err(e)}}
const myNotes=async()=>ok(await db.from('notifications').select('*').or(`target_role.eq.${me.role},target_user_id.eq.${me.id}`).order('created_at',{ascending:false}).limit(50));
async function bell(){try{const n=(await myNotes()).filter(x=>new Date(x.created_at)>+(localStorage.getItem('seen'+me.id)||0)).length;const b=$('#nfb');if(b&&n)b.textContent='('+n+')'}catch(e){}}
async function remind(){try{const A=ok(await db.from('assessments').select('id,title,deadline,courses(code,level)').eq('is_active',true).gt('deadline',new Date().toISOString()).lt('deadline',new Date(Date.now()+1728e5).toISOString()));
const done=ok(await db.from('assessment_submissions').select('assessment_id').eq('student_id',me.id)).map(x=>x.assessment_id),have=ok(await db.from('notifications').select('link_url').eq('target_user_id',me.id).like('link_url','/reminder/%')).map(x=>x.link_url);
const rows=A.filter(a=>a.courses.level==me.level&&!done.includes(a.id)&&!have.includes('/reminder/'+a.id)).map(a=>({target_user_id:me.id,title:'Deadline soon',message:`${a.title} (${a.courses.code}) is due ${fd(a.deadline)}`,link_url:'/reminder/'+a.id}));if(rows.length){await notify(rows);bell()}}catch(e){}}
// ---------- Views ----------
const V={
async home(){const[n]=await Promise.all([myNotes()]);v(`<div class="c"><h3>Welcome, ${H(me.name)}</h3><span class="tag">${RN[me.role]}</span> <span class="tag ok">${n.filter(x=>new Date(x.created_at)>+(localStorage.getItem('seen'+me.id)||0)).length} new alerts</span></div><div class="g">${NAV[me.role].slice(1).map(k=>`<button class="c tile" onclick="go('${k}')"><div style="font-size:28px">${TI[k][0]}</div>${TI[k][1]}</button>`).join('')}</div>`)},
async dir(){DIR=ok(await db.from('lecturers').select('id,full_name,email,phone_number,designation,office_location,is_head_of_department,course_lecturers(is_lead,courses(code,title))').order('full_name'));
v(`<div class="c"><input id="dq" placeholder="Search name, course code or course title…" oninput="dl()" style="margin:0"></div><div class="g" id="dl"></div>`);dl()},
async mat(){const[M,C]=await Promise.all([db.from('course_materials').select('*,courses(code,title)').order('created_at',{ascending:false}).then(ok),canUp()?db.from('courses').select('id,code').order('code').then(ok):[]]);
MAT=M.filter(m=>m.is_public||isLec()||isAd()||m.uploaded_by_id==me.id);
v(`${canUp()?`<div class="c"><h3>Upload PDF</h3><label>Course</label><select id="mc">${C.map(c=>`<option value="${c.id}">${H(c.code)}</option>`)}</select><label>Title</label><input id="mt"><label>Description (optional)</label><input id="md2"><label>PDF file</label><input id="mf" type="file" accept="application/pdf"><label style="display:flex;align-items:center;color:var(--tx)"><input type="checkbox" id="mp" checked>Public (students can see it)</label><button class="p" onclick="upl()">Upload</button><div id="um" class="mu"></div></div>`:''}
<div class="c"><h3>Course materials</h3>${MAT.map(m=>{const own=m.uploaded_by_id==me.id||isAd();return`<div class="row"><div><b>${H(m.title)}</b> ${m.is_public?'':'<span class="tag er">🔒 Private</span>'}<div class="mu">${H(m.courses.code)} · ${m.uploaded_by_type.replace('_',' ').toLowerCase()} · ${fd(m.created_at)}</div></div><div class="r"><a href="${H(m.file_url)}" target="_blank" rel="noopener"><button class="s">Open</button></a>${own?`<button class="s" onclick="vis('${m.id}',${!m.is_public})">${m.is_public?'Make private':'Make public'}</button><button class="s d" onclick="delM('${m.id}')">✕</button>`:''}</div></div>`}).join('')||'<span class="mu">No materials yet.</span>'}</div>`)},
async exam(){let h='';
if(isLec()){const C=ok(await db.from('courses').select('id,code').order('code'));h=`<div class="c"><h3>Create assessment</h3><div class="g"><div><label>Course</label><select id="xc">${C.map(c=>`<option value="${c.id}">${H(c.code)}</option>`)}</select></div><div><label>Title</label><input id="xt"></div><div><label>Type</label><select id="xk"><option>QUIZ</option><option>TEST</option><option>EXAM</option><option>ASSIGNMENT</option></select></div><div><label>Passcode</label><input id="xp" maxlength="12" autocapitalize="none"></div><div><label>Time limit (min)</label><input id="xd" type="number" value="30"></div><div><label>Deadline</label><input id="xl" type="datetime-local"></div></div>
<h3>✨ AI question generator (Gemini)</h3><textarea id="xn" rows="4" placeholder="Paste lecture notes or a topic summary…"></textarea><div class="r"><input id="xq" type="number" value="5" min="1" max="20" style="width:90px"><button class="g2" onclick="ai()">Generate</button></div><div id="am" class="mu"></div>
<h3>✍️ Manual question</h3><textarea id="qq" rows="2" placeholder="Question"></textarea>${[0,1,2,3].map(i=>`<input class="qo" placeholder="Option ${'ABCD'[i]}">`).join('')}<select id="qc"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><button onclick="aq()">Add question</button>
<h3 style="margin-top:14px">Draft</h3><div id="dr"></div><button class="p" onclick="pub()">Publish</button></div>`}
const A=ok(await db.from('assessments').select('id,title,assessment_type,duration_minutes,total_marks,is_active,deadline,created_by_id,courses(code,level)'+(isLec()?',passcode':''))
