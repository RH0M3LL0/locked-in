<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Robot with graduation cap logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f9d6b"/>
      <stop offset="1" stop-color="#0b5d45"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e6e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- antenna-free robot head -->
  <rect x="96" y="212" width="320" height="236" rx="84" fill="url(#head)"/>
  <!-- ear pods -->
  <rect x="70" y="288" width="34" height="84" rx="17" fill="#c5d6ce"/>
  <rect x="408" y="288" width="34" height="84" rx="17" fill="#c5d6ce"/>

  <!-- face screen -->
  <rect x="132" y="244" width="248" height="172" rx="58" fill="#14262b"/>

  <!-- eyes -->
  <ellipse cx="206" cy="318" rx="25" ry="32" fill="#ffc533"/>
  <ellipse cx="306" cy="318" rx="25" ry="32" fill="#ffc533"/>
  <ellipse cx="214" cy="306" rx="8" ry="10" fill="#fff4c9"/>
  <ellipse cx="314" cy="306" rx="8" ry="10" fill="#fff4c9"/>

  <!-- smile -->
  <path d="M226 374 Q256 396 286 374" fill="none" stroke="#ffc533" stroke-width="10" stroke-linecap="round"/>

  <!-- graduation cap: base -->
  <path d="M160 196 L160 238 Q256 280 352 238 L352 196 Z" fill="#134d8f"/>
  <path d="M160 196 L160 238 Q256 280 352 238 L352 196 Q256 236 160 196 Z" fill="#1a63b5"/>
  <!-- graduation cap: board -->
  <path d="M256 98 L452 164 L256 230 L60 164 Z" fill="#2a7bd6"/>
  <path d="M256 98 L452 164 L256 230 Z" fill="#1f66b8"/>
  <path d="M256 98 L60 164 L256 230 Z" fill="#3b8ee6"/>
  <!-- cap button -->
  <circle cx="256" cy="164" r="11" fill="#ffc533"/>
  <!-- tassel -->
  <path d="M256 164 L400 190" stroke="#ffc533" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M400 190 L400 252" stroke="#ffc533" stroke-width="7" stroke-linecap="round" fill="none"/>
  <rect x="390" y="246" width="20" height="38" rx="8" fill="#ffc533"/>
</svg>
